[project]
name = "notify-mcp-server"
version = "0.1.0"
description = "Local, free, offline MCP server that plays a sound and speaks a short status update. macOS / Windows / Linux."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas Tonon", email = "ltononro@gmail.com" }]
keywords = ["notify", "tts", "text-to-speech", "sound", "voice", "attention", "mcp"]
dependencies = ["mcp[cli]>=1.2.0,<2"]

[project.urls]
Homepage = "https://github.com/lucastononro/notify"
Repository = "https://github.com/lucastononro/notify"

[project.scripts]
notify-mcp = "notify_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notify_mcp"]
